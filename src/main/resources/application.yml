spring:
  application:
    name: paytrack
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/paytrack}
    username: ${DATABASE_USERNAME:paytrack}
    password: ${DATABASE_PASSWORD:local_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway creates the schema; Hibernate validates entity mappings.
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:paytrack}
    password: ${RABBITMQ_PASSWORD:local_dev_only}
    stream:
      host: ${RABBITMQ_STREAM_HOST:localhost}
      port: ${RABBITMQ_STREAM_PORT:5552}

server:
  port: ${PORT:8080}
