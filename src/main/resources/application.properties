spring.application.name=paytrack

# Database configuration: defaults to local in-memory H2 if PostgreSQL is not specified
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:paytrack;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Disable Docker compose auto-discovery in local dev unless Docker is running
spring.docker.compose.enabled=false

# Autoconfiguration exclusions for standalone run if Redis or RabbitMQ are not running locally
spring.autoconfigure.exclude=\
  org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,\
  org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration
